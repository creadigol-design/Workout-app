<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Round One">
  <title>ROUND ONE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="strip">
      <span class="brand">ROUND ONE</span>
      <span class="row">
        <button class="icon-btn" id="btnSound" data-act="toggleSound" aria-label="Toggle sound">♪</button>
        <button class="icon-btn" data-act="openSettings" aria-label="Settings">⚙</button>
      </span>
    </div>
    <div id="hud"></div>
    <main id="screen"></main>
  </div>

  <div class="dock"><div class="dock-in" id="dock"></div></div>
  <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
  <div id="modal"></div>
  <div id="toast" class="toast" hidden></div>
  <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="progressInput" accept="image/*" hidden>
  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
